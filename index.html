<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Count</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; --bg:#0b0b0f; --fg:#f2f2f5; --mute:#8a8a99; --accent:#7cf; --hot:#f6c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, sans-serif; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:24px; padding:16px; text-align:center; }
  #count { font-size: clamp(120px, 40vw, 320px); font-weight:800; line-height:1;
    font-variant-numeric: tabular-nums; transition: transform .15s, color .15s; }
  #count.bump { transform: scale(1.15); color: var(--hot); }
  .label { color:var(--mute); letter-spacing:.2em; text-transform:uppercase; font-size:14px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; font-size:18px; padding:14px 24px; border-radius:999px; border:1px solid #333;
    background:#16161d; color:var(--fg); cursor:pointer; min-height:48px; }
  button.primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:700; }
  #live { min-height:3em; max-width:640px; color:var(--mute); font-size:16px; }
  #status { font-size:13px; color:var(--mute); }
  mark { background:var(--hot); color:#000; border-radius:4px; padding:0 3px; }
</style>
</head>
<body>
  <div class="label">Zmínek „AI"</div>
  <div id="count" aria-live="polite">0</div>
  <div class="row">
    <button id="toggle" class="primary">Start</button>
    <button id="plus" aria-label="Přičíst ručně">+1</button>
    <button id="reset">Reset</button>
  </div>
  <div id="live"></div>
  <div id="status"></div>
<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';

const $ = (id) => document.getElementById(id);
// Whisper spells "AI" many ways in Czech; match the spoken variants too.
const RE = /(?<![\p{L}\d])(a\.?\s?i\.?|ej\s?aj|éj\s?aj|ej\s?ej|ajaj|ai)(?![\p{L}\d])/giu;
const RATE = 16000, CHUNK_S = 4, SILENCE_RMS = 0.01;

let count = +localStorage.getItem('aicount') || 0;
let running = false, asr = null, ctx = null, stream = null, wakeLock = null;
let buf = [], busy = false, queue = [];

function render(bump) {
  $('count').textContent = count;
  localStorage.setItem('aicount', count);
  if (bump) { $('count').classList.add('bump'); setTimeout(() => $('count').classList.remove('bump'), 200); }
}
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
const status = (t) => ($('status').textContent = t);

async function loadModel() {
  if (asr) return asr;
  const gpu = !!navigator.gpu;
  status('Stahuji model (jednou, pak je v cache)…');
  asr = await pipeline('automatic-speech-recognition', 'onnx-community/whisper-base', {
    device: gpu ? 'webgpu' : 'wasm',
    dtype: gpu ? { encoder_model: 'fp32', decoder_model_merged: 'q4' } : 'q8',
    progress_callback: (p) => p.status === 'progress' && status(`Stahuji ${p.file}: ${Math.round(p.progress)} %`),
  });
  return asr;
}

async function drain() {
  if (busy) return;
  busy = true;
  while (queue.length) {
    // ponytail: drops backlog when inference is slower than realtime; smaller model if that happens often
    const audio = queue.length > 2 ? queue.splice(0).pop() : queue.shift();
    const { text } = await asr(audio, { language: 'czech', task: 'transcribe' });
    const n = (text.match(RE) || []).length;
    if (n) { count += n; render(true); }
    $('live').innerHTML = esc(text).replace(RE, '<mark>$&</mark>');
  }
  busy = false;
}

function onChunk(audio) {
  let sum = 0;
  for (const v of audio) sum += v * v;
  // Whisper hallucinates text on silence, so skip quiet chunks.
  if (Math.sqrt(sum / audio.length) < SILENCE_RMS) return;
  queue.push(audio);
  drain();
}

async function start() {
  try {
    $('toggle').disabled = true;
    await loadModel();
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    ctx = new AudioContext({ sampleRate: RATE });
    const src = ctx.createMediaStreamSource(stream);
    // ponytail: ScriptProcessor is deprecated but universal; AudioWorklet if it ever gets removed
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    let len = 0;
    proc.onaudioprocess = (e) => {
      const d = e.inputBuffer.getChannelData(0);
      buf.push(new Float32Array(d)); len += d.length;
      if (len >= RATE * CHUNK_S) {
        const out = new Float32Array(len);
        let o = 0; for (const b of buf) { out.set(b, o); o += b.length; }
        buf = []; len = 0;
        onChunk(out);
      }
    };
    src.connect(proc); proc.connect(ctx.destination);
    running = true;
    $('toggle').textContent = 'Stop';
    status('Poslouchám… (lokálně, ' + (navigator.gpu ? 'WebGPU' : 'WASM') + ')');
    navigator.wakeLock?.request('screen').then((l) => (wakeLock = l)).catch(() => {});
  } catch (e) {
    status('Chyba: ' + e.message);
  } finally {
    $('toggle').disabled = false;
  }
}

function stop() {
  running = false;
  stream?.getTracks().forEach((t) => t.stop());
  ctx?.close(); ctx = null; buf = [];
  wakeLock?.release(); wakeLock = null;
  $('toggle').textContent = 'Start';
  status('Zastaveno');
}

$('toggle').onclick = () => (running ? stop() : start());
$('plus').onclick = () => { count++; render(true); };
$('reset').onclick = () => { count = 0; render(); };
render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
